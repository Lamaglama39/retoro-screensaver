<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/dvd-logo.png">
    <title>DVD Screensaver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="settings">
        <div class="setting-group">
            <label for="speed">速度:</label>
            <input type="range" id="speed" min="1" max="10" value="2">
        </div>
        <div class="setting-group">
            <label for="size">サイズ:</label>
            <input type="range" id="size" min="1" max="10" value="5">
        </div>
        <div class="setting-group">
            <label for="color-change">反射時の色変更:</label>
            <div class="toggle-wrapper">
                <div class="toggle-container">
                    <input type="checkbox" id="color-change" checked>
                    <label for="color-change" class="toggle-switch"></label>
                </div>
                <span class="toggle-label" id="color-change-status">オン</span>
            </div>
        </div>
        <div class="setting-group" id="text-group">
            <label for="text">表示テキスト:</label>
            <input type="text" id="text" value="DVD">
            <button id="apply-text" class="btn btn-apply">テキストを適用</button>
        </div>
        <div class="setting-group" id="image-group">
            <label for="image-upload">画像をアップロード:</label>
            <input type="file" id="image-upload" accept="image/*">
            <button id="remove-image" class="btn">画像を削除</button>
        </div>
    </div>
    <div id="dvd-logo"><h1>DVD</h1></div>
    <script type="module" src="./script.js"></script>
</body>
</html>
